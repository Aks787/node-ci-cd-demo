name: CI-CD

on:
  workflow_dispatch

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: checking code
        uses: actions/checkout@v4

      - name: Setup node.js-alpine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install productions dependencies only
        run: npm install

      - name: Run tests
        run: npm test
  
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for scanning
        run: docker build -t cloudstatus:${{ github.sha }}

      - name: Run Trivy Scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'cloudstatus:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  publish-registry:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudstatus:${{ github.sha }}
            ${{secrets.DOCKERHUB_USERNAME }}/cloudstatus:latest

  deploy-to-production:
    runs-on: ubuntu-latest
    needs: publish-registry # Runs ONLY after the fresh image is on Docker Hub
    steps:
      - name: Deploy application
        run: |
          echo "Connecting to your hosting provider..."
          echo "Pulling image: ${{ secrets.DOCKERHUB_USERNAME }}/cloudstatus:latest"
          echo "Restarting containers..."
          echo "CD Phase Complete! Application is live."
          # TODO: Replace these echoes with your actual cloud platform actio
